name: Format

on:
  push:
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Formatting needs no native modules (better-sqlite3, bcrypt): skip their builds
      - run: npm ci --ignore-scripts
      - run: npm run format:check
